name: Spikes

on:
  push:
    paths:
      - 'spikes/**'
      - '.github/workflows/spikes.yml'
      - 'global.json'
  pull_request:
    paths:
      - 'spikes/**'
      - '.github/workflows/spikes.yml'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  opentk-spike:
    # Собирает spike и запускает его тесты. Тесты не создают окно и не требуют GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build and test OpenTK spike
        run: dotnet test spikes/OpenTkSpike.Tests --configuration Release --logger "trx;LogFileName=spike-tests.trx" --results-directory artifacts/spike-tests

      - name: Upload spike test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-test-results
          path: artifacts/spike-tests/*.trx
          if-no-files-found: warn

  opentk-spike-smoke:
    timeout-minutes: 15
    # Запускает окно spike на виртуальном дисплее (Xvfb) с программным OpenGL Mesa (llvmpipe):
    # повторные открытия/закрытия, обнаружение ошибки OpenGL, проверка culling, контрольные кадры.
    # Это проверка поведения, а не производительности; картинку на реальном GPU проверяют вручную (docs/spikes.md).
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri \
            libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 libxrandr2

      - name: Smoke test in virtual display
        timeout-minutes: 5
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' bash spikes/OpenTkSpike/smoke-test.sh artifacts/spike-smoke

      - name: Upload smoke test logs and frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-smoke
          path: artifacts/spike-smoke
          if-no-files-found: warn
