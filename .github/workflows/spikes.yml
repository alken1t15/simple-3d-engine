name: Spikes

on:
  push:
    paths:
      - 'spikes/**'
      - '.github/workflows/spikes.yml'
  pull_request:
    paths:
      - 'spikes/**'
      - '.github/workflows/spikes.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  opentk-spike:
    # Собирает spike и запускает его тесты. Тесты не создают окно и не требуют GPU;
    # визуальная проверка выполняется вручную по docs/spikes.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build and test OpenTK spike
        run: dotnet test spikes/OpenTkSpike.Tests --configuration Release
